<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>TW Alert Extender</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 300px;
      padding: 12px;
      background: #131722;
      color: #d1d4dc;
    }
    h3 { margin: 0 0 8px; }
    button {
      width: 100%;
      padding: 8px;
      background: #2962ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 6px;
    }
    button:hover { background: #1e53e5; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }
    a { color: #2962ff; font-size: 12px; }
    .row { margin-top: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <h3>TW Alert Extender</h3>

  <button id="runBtn">Проверить и продлить сейчас</button>

  <div id="status">Готово.</div>

  <div class="row"><a id="optionsLink" href="#">Настройки</a></div>

  <script src="popup.js"></script>
</body>
</html>
